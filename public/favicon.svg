<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="amber-core" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="30%" stop-color="#FF9E00" />
      <stop offset="70%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#B23A00" />
    </radialGradient>
    <radialGradient id="blue-core" cx="65%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="30%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#002984" />
      <stop offset="100%" stop-color="#001040" />
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="256" cy="256" r="230" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip)">
    <!-- Fondo transparente nativo con la esfera delimitada -->
    <circle cx="256" cy="256" r="230" fill="#0A122A" />
    
    <!-- Flujos internos de energía en S (Ámbar y Azul) -->
    <path d="M 256,60 C 140,70 90,170 100,270 C 110,360 180,440 270,440 C 200,400 170,340 175,270 C 180,190 240,130 310,100 C 285,80 270,65 256,60 Z" fill="url(#amber-core)" />
    
    <path d="M 256,452 C 372,442 422,342 412,242 C 402,152 332,72 242,72 C 312,112 342,172 337,242 C 332,322 272,382 202,412 C 227,432 242,447 256,452 Z" fill="url(#blue-core)" />

    <!-- Brillo superior tipo cristal -->
    <ellipse cx="256" cy="150" rx="160" ry="80" fill="url(#glass)" />
    
    <!-- Borde exterior de la esfera -->
    <circle cx="256" cy="256" r="230" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-opacity="0.4" />
  </g>
</svg>