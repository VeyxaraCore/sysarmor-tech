<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Azul Ciano Neón -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Gradiente Amarillo Intenso -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF000" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
  </defs>

  <!-- Grupo rotado a Horizontal (-90 deg) -->
  <g transform="rotate(-90 50 50)">
    <!-- Base Azul Ciano -->
    <circle cx="50" cy="50" r="48" fill="url(#cyanGrad)" />

    <!-- Lado Amarillo Intenso -->
    <path d="M 50,2 A 48,48 0 0,1 50,98 A 24,24 0 0,1 50,50 A 24,24 0 0,0 50,2 Z" fill="url(#yellowGrad)" />

    <!-- Línea Divisoria Central en Azul Profundo Corporativo (#0d1527) -->
    <path d="M 50,2 A 24,24 0 0,1 50,50 A 24,24 0 0,0 50,98" fill="none" stroke="#0d1527" stroke-width="3" stroke-linecap="round" />

    <!-- Ojo Azul Ciano en el lado Amarillo -->
    <circle cx="50" cy="26" r="8" fill="url(#cyanGrad)" />

    <!-- Ojo Amarillo Intenso en el lado Azul -->
    <circle cx="50" cy="74" r="8" fill="url(#yellowGrad)" />
  </g>
</svg>