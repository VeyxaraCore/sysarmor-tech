<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente 1: Ámbar Neón / Oro Ardiente -->
    <linearGradient id="amberTubeUltra" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d94600" />
      <stop offset="35%" stop-color="#ff6b00" />
      <stop offset="70%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>

    <!-- Gradiente 2: Cian Eléctrico / Turquesa Láser -->
    <linearGradient id="cyanTubeUltra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="35%" stop-color="#00d2ff" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Sombra suave para dar profundidad al cruce -->
    <filter id="shadow3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Contenedor Base Squircle (Gris Carbón Oscuro Puro) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#090d16" />

  <!-- Barra 1: Ámbar Neón (X grande, aprovechando espacio y SIN CLIP) -->
  <g filter="url(#shadow3D)">
    <path d="M 96 416 L 416 96" stroke="url(#amberTubeUltra)" stroke-width="132" stroke-linecap="round" />
    <path d="M 96 416 L 416 96" stroke="#ffffff" stroke-width="24" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Barra 2: Cian Eléctrico -->
  <g filter="url(#shadow3D)">
    <path d="M 96 96 L 416 416" stroke="url(#cyanTubeUltra)" stroke-width="132" stroke-linecap="round" />
    <path d="M 96 96 L 416 416" stroke="#ffffff" stroke-width="24" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>